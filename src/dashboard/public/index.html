<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trusted OwO Gen v4 | Red Enterprise Dashboard & Controller</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#040407',
                            900: '#07070a',
                            800: '#0d0d12',
                            700: '#14141c',
                            600: '#1c1c28',
                        },
                        crimson: {
                            400: '#f87171',
                            500: '#ff2a4b',
                            600: '#ef4444',
                            700: '#dc2626',
                            800: '#991b1b',
                            900: '#7f1d1d',
                            950: '#450a0a',
                        }
                    },
                    boxShadow: {
                        'neon-red': '0 0 25px -5px rgba(239, 68, 68, 0.4)',
                        'neon-card': '0 4px 20px -2px rgba(220, 38, 38, 0.15)',
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #07070a;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0d12;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b1216;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ef4444;
        }
        .glass-panel {
            background: rgba(18, 18, 25, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .glass-panel:hover {
            border-color: rgba(239, 68, 68, 0.35);
        }
    </style>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion || window.framerMotion || {
            motion: {
                div: (props) => <div {...props}>{props.children}</div>,
                button: (props) => <button {...props}>{props.children}</button>,
                span: (props) => <span {...props}>{props.children}</span>,
            },
            AnimatePresence: ({ children }) => <>{children}</>
        };

        const DEFAULT_CONFIG = {
            guildID: "",
            channelID: [],
            wayNotify: ["webhook"],
            webhookURL: "",
            adminID: "",
            captchaAPI: "",
            apiKey: "",
            prefix: "owo",
            autoGem: 0,
            gemTier: ["common", "uncommon", "rare", "epic", "mythical"],
            autoHuntbot: true,
            autoTrait: "efficiency",
            autoBattle: true,
            autoPray: ["pray"],
            autoDaily: true,
            autoCookie: true,
            autoClover: true,
            autoLootbox: true,
            autoFabledLootbox: false,
            autoSleep: true,
            autoSell: false,
            showRPC: true,
            autoResume: true,
        };

        function DashboardApp() {
            // Global App State
            const [isRunning, setIsRunning] = useState(false);
            const [activeTab, setActiveTab] = useState("overview");
            const [accounts, setAccounts] = useState([]);
            const [stats, setStats] = useState({
                isRunning: false,
                totalAccounts: 0,
                activeCount: 0,
                totalCommands: 0,
                totalCaptchaSolved: 0,
                totalCaptchaFailed: 0,
                globalUptime: 0
            });
            const [logs, setLogs] = useState([]);
            const [sharedConfig, setSharedConfig] = useState(DEFAULT_CONFIG);

            // Web Setup Wizard State
            const [tokens, setTokens] = useState(["", "", ""]);
            const [showToken, setShowToken] = useState([false, false, false]);
            const [isVerifying, setIsVerifying] = useState(false);
            const [verifiedAccounts, setVerifiedAccounts] = useState([]);
            const [verifyError, setVerifyError] = useState("");
            const [isStarting, setIsStarting] = useState(false);
            const [startError, setStartError] = useState("");
            const [savedData, setSavedData] = useState(null);

            // Channel / Guild state
            const [selectedGuild, setSelectedGuild] = useState("");
            const [manualMode, setManualMode] = useState(false);
            const [manualGuildID, setManualGuildID] = useState("");
            const [manualChannelIDs, setManualChannelIDs] = useState("");

            // Terminal filters
            const [logFilter, setLogFilter] = useState("ALL");
            const [accountFilter, setAccountFilter] = useState("ALL");
            const [autoScroll, setAutoScroll] = useState(true);
            const [saveStatus, setSaveStatus] = useState("");
            const terminalEndRef = useRef(null);

            // Fetch initial status and saved config
            const fetchData = async () => {
                try {
                    const res = await fetch("/api/status");
                    const data = await res.json();
                    if (data.isRunning !== undefined) {
                        setIsRunning(data.isRunning);
                    }
                    if (data.accounts && data.accounts.length > 0) {
                        setAccounts(data.accounts);
                        setIsRunning(true);
                    }
                    if (data.stats) setStats(data.stats);
                    if (data.config && Object.keys(data.config).length > 0) {
                        setSharedConfig(prev => ({ ...prev, ...data.config }));
                    }
                    if (data.saved) {
                        setSavedData(data.saved);
                    }
                } catch (e) {
                    console.error("Fetch status error:", e);
                }
            };

            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 4000);

                // SSE Stream for logs and live stats
                const evtSource = new EventSource("/api/events");
                evtSource.onmessage = (event) => {
                    try {
                        const parsed = JSON.parse(event.data);
                        if (parsed.type === "init" || parsed.type === "status") {
                            const data = parsed.data || parsed;
                            if (data.isRunning !== undefined) setIsRunning(data.isRunning);
                            if (data.accounts) setAccounts(data.accounts);
                            if (data.stats) setStats(data.stats);
                            if (data.config && Object.keys(data.config).length > 0) setSharedConfig(data.config);
                        } else if (parsed.type === "log") {
                            setLogs((prev) => [...prev.slice(-300), parsed.data]);
                        }
                    } catch (err) {
                        console.error("SSE parse error:", err);
                    }
                };

                return () => {
                    clearInterval(interval);
                    evtSource.close();
                };
            }, []);

            // Auto-scroll logs
            useEffect(() => {
                if (autoScroll && terminalEndRef.current) {
                    terminalEndRef.current.scrollIntoView({ behavior: "smooth" });
                }
            }, [logs, autoScroll]);

            // Handle Quick Load of Saved Config
            const handleLoadSaved = () => {
                if (!savedData) return;
                if (savedData.tokens && savedData.tokens.length > 0) {
                    const newTokens = ["", "", ""];
                    savedData.tokens.slice(0, 3).forEach((tok, i) => newTokens[i] = tok);
                    setTokens(newTokens);
                }
                if (savedData.config && Object.keys(savedData.config).length > 0) {
                    setSharedConfig(prev => ({ ...prev, ...savedData.config }));
                    if (savedData.config.guildID) {
                        setSelectedGuild(savedData.config.guildID);
                        setManualGuildID(savedData.config.guildID);
                    }
                    if (savedData.config.channelID) {
                        setManualChannelIDs(Array.isArray(savedData.config.channelID) ? savedData.config.channelID.join(", ") : savedData.config.channelID);
                    }
                }
            };

            // Handle Token Verification
            const handleVerifyTokens = async () => {
                const activeTokens = tokens.filter(t => t.trim().length > 0);
                if (activeTokens.length === 0) {
                    setVerifyError("Please enter at least Account 1 token.");
                    return;
                }
                setVerifyError("");
                setIsVerifying(true);

                try {
                    const res = await fetch("/api/setup/verify-tokens", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ tokens: activeTokens })
                    });
                    const data = await res.json();
                    if (data.success && data.verified) {
                        setVerifiedAccounts(data.verified);
                        const validOnes = data.verified.filter(v => v.valid);
                        if (validOnes.length === 0) {
                            setVerifyError("None of the provided tokens could connect to Discord.");
                        } else {
                            // Default select first guild
                            const firstGuilds = validOnes[0].guilds;
                            if (firstGuilds && firstGuilds.length > 0) {
                                setSelectedGuild(firstGuilds[0].id);
                                if (firstGuilds[0].channels && firstGuilds[0].channels.length > 0) {
                                    setSharedConfig(c => ({
                                        ...c,
                                        guildID: firstGuilds[0].id,
                                        channelID: [firstGuilds[0].channels[0].id]
                                    }));
                                }
                            }
                        }
                    } else {
                        setVerifyError(data.error || "Verification failed");
                    }
                } catch (e) {
                    setVerifyError("Network error while verifying tokens.");
                } finally {
                    setIsVerifying(false);
                }
            };

            // Launch Multi-Token Farm
            const handleStartFarm = async () => {
                setStartError("");
                const activeTokens = tokens.filter(t => t.trim().length > 0);
                if (activeTokens.length === 0) {
                    setStartError("Please provide at least 1 Discord token.");
                    return;
                }

                let finalGuildID = selectedGuild;
                let finalChannelIDs = sharedConfig.channelID || [];

                if (manualMode) {
                    finalGuildID = manualGuildID.trim();
                    finalChannelIDs = manualChannelIDs.split(",").map(c => c.trim()).filter(Boolean);
                }

                if (!finalGuildID) {
                    setStartError("Please select or enter a Discord Guild/Server ID.");
                    return;
                }
                if (!finalChannelIDs || finalChannelIDs.length === 0) {
                    setStartError("Please select or enter at least one Channel ID.");
                    return;
                }

                setIsStarting(true);
                try {
                    const payload = {
                        tokens: activeTokens,
                        config: {
                            ...sharedConfig,
                            guildID: finalGuildID,
                            channelID: finalChannelIDs
                        }
                    };

                    const res = await fetch("/api/setup/start", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.success) {
                        setIsRunning(true);
                        fetchData();
                    } else {
                        setStartError(data.error || "Failed to start farming.");
                    }
                } catch (err) {
                    setStartError("Network error while starting farming loop.");
                } finally {
                    setIsStarting(false);
                }
            };

            // Stop Farming and Return to Setup
            const handleStopFarm = async () => {
                if (!confirm("Are you sure you want to stop farming and reconfigure?")) return;
                try {
                    await fetch("/api/setup/stop", { method: "POST" });
                    setIsRunning(false);
                    setAccounts([]);
                    fetchData();
                } catch (e) {
                    console.error("Stop error:", e);
                }
            };

            // Pause / Resume single or all
            const handlePause = async (id) => {
                await fetch(`/api/accounts/pause?id=${id || "all"}`, { method: "POST" });
                fetchData();
            };

            const handleResume = async (id) => {
                await fetch(`/api/accounts/resume?id=${id || "all"}`, { method: "POST" });
                fetchData();
            };

            // Save Live Config
            const handleSaveConfig = async (e) => {
                if (e) e.preventDefault();
                setSaveStatus("Saving...");
                try {
                    const res = await fetch("/api/config", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(sharedConfig)
                    });
                    if (res.ok) {
                        setSaveStatus("Applied to All Accounts!");
                        setTimeout(() => setSaveStatus(""), 3000);
                    } else {
                        setSaveStatus("Save failed!");
                    }
                } catch (err) {
                    setSaveStatus("Error saving!");
                }
            };

            // Selected guild channels
            const currentGuildObj = verifiedAccounts[0]?.guilds?.find(g => g.id === selectedGuild);

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Top Navigation Bar */}
                    <header className="border-b border-crimson-900/40 bg-dark-800/80 backdrop-blur-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-crimson-700 to-rose-500 flex items-center justify-center shadow-neon-red">
                                    <span className="text-xl font-extrabold text-white">⚡</span>
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                                        TRUSTED OWO <span className="text-crimson-500 text-xs px-2 py-0.5 rounded-full bg-crimson-950/80 border border-crimson-600/50">GEN V4</span>
                                    </h1>
                                    <p className="text-xs text-gray-400">Enterprise Web Controller & Farm Engine</p>
                                </div>
                            </div>

                            {/* Running Navigation Tabs */}
                            {isRunning ? (
                                <nav className="flex space-x-1 sm:space-x-2">
                                    {[
                                        { id: "overview", label: "Overview", icon: "📊" },
                                        { id: "accounts", label: "3 Accounts", icon: "👥" },
                                        { id: "terminal", label: "Live Terminal", icon: "💻" },
                                        { id: "config", label: "Shared Config", icon: "⚙️" },
                                        { id: "safety", label: "Safety & Captcha", icon: "🛡️" },
                                    ].map((tab) => (
                                        <button
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className={`px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center gap-1.5 ${
                                                activeTab === tab.id
                                                    ? "bg-gradient-to-r from-crimson-600 to-rose-600 text-white shadow-neon-red font-semibold"
                                                    : "text-gray-400 hover:text-white hover:bg-dark-700/60"
                                            }`}
                                        >
                                            <span>{tab.icon}</span>
                                            <span>{tab.label}</span>
                                        </button>
                                    ))}
                                </nav>
                            ) : (
                                <div className="text-xs text-crimson-400 font-semibold px-3 py-1 bg-crimson-950/60 rounded-full border border-crimson-700/40 flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-crimson-500 animate-pulse"></span> Web Setup Mode
                                </div>
                            )}

                            {/* Action Buttons */}
                            <div className="flex items-center space-x-3">
                                {isRunning ? (
                                    <>
                                        <button
                                            onClick={() => stats.activeCount === 0 ? handleResume("all") : handlePause("all")}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all ${
                                                stats.activeCount === 0
                                                    ? "bg-emerald-600/20 text-emerald-400 border border-emerald-500/40 hover:bg-emerald-600/30"
                                                    : "bg-amber-600/20 text-amber-400 border border-amber-500/40 hover:bg-amber-600/30"
                                            }`}
                                        >
                                            <span>{stats.activeCount === 0 ? "▶️ Resume All" : "⏸️ Pause All"}</span>
                                        </button>
                                        <button
                                            onClick={handleStopFarm}
                                            className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-crimson-900/40 text-crimson-400 border border-crimson-700/50 hover:bg-crimson-800/50 transition-all flex items-center gap-1"
                                        >
                                            <span>🛑 Stop & Reconfigure</span>
                                        </button>
                                    </>
                                ) : (
                                    savedData?.tokens?.length > 0 && (
                                        <button
                                            onClick={handleLoadSaved}
                                            className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-dark-700 text-gray-200 border border-crimson-700/40 hover:text-white hover:border-crimson-500 transition-all flex items-center gap-1.5"
                                        >
                                            <span>⚡ Quick Load Saved</span>
                                        </button>
                                    )
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        {!isRunning ? (
                            /* ========================================================================= */
                            /* 🔴 WEB SETUP WIZARD (No CLI interaction required!)                        */
                            /* ========================================================================= */
                            <div className="space-y-6">
                                {/* Banner */}
                                <div className="glass-panel p-6 rounded-2xl border-l-4 border-crimson-600 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div>
                                        <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                            <span>🚀 Web-Based Multi-Token Setup</span>
                                            <span className="text-xs px-2.5 py-0.5 rounded-full bg-crimson-900/60 text-crimson-300 font-mono">3 ACCOUNTS CONCURRENT</span>
                                        </h2>
                                        <p className="text-sm text-gray-400 mt-1">
                                            Configure all tokens and settings right here. Once launched, all accounts farm simultaneously with zero terminal commands needed!
                                        </p>
                                    </div>
                                    {savedData?.tokens?.length > 0 && (
                                        <button
                                            onClick={handleLoadSaved}
                                            className="self-start md:self-auto px-4 py-2 rounded-xl text-xs font-bold bg-crimson-600 hover:bg-crimson-500 text-white shadow-neon-red transition-all flex items-center gap-2"
                                        >
                                            <span>⚡ Load Saved Config ({savedData.tokens.length} Accounts)</span>
                                        </button>
                                    )}
                                </div>

                                {/* Step 1: Discord Tokens */}
                                <div className="glass-panel p-6 rounded-2xl space-y-4">
                                    <div className="flex items-center justify-between">
                                        <h3 className="text-base font-bold text-white flex items-center gap-2">
                                            <span className="w-6 h-6 rounded-lg bg-crimson-600/30 text-crimson-400 flex items-center justify-center text-xs font-mono">1</span>
                                            <span>Enter Discord Tokens (Up to 3 Accounts)</span>
                                        </h3>
                                        <span className="text-xs text-gray-400">Account 1 is required; Accounts 2 & 3 are optional</span>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {[0, 1, 2].map(idx => (
                                            <div key={idx} className="bg-dark-800/80 p-4 rounded-xl border border-dark-600 focus-within:border-crimson-600 transition-all">
                                                <div className="flex items-center justify-between mb-2">
                                                    <span className="text-xs font-bold text-gray-300">
                                                        Account {idx + 1} {idx === 0 ? <span className="text-crimson-400">*</span> : <span className="text-gray-500 font-normal">(Optional)</span>}
                                                    </span>
                                                    <button
                                                        type="button"
                                                        onClick={() => setShowToken(prev => { const n = [...prev]; n[idx] = !n[idx]; return n; })}
                                                        className="text-xs text-gray-400 hover:text-white"
                                                    >
                                                        {showToken[idx] ? "Hide" : "Show"}
                                                    </button>
                                                </div>
                                                <input
                                                    type={showToken[idx] ? "text" : "password"}
                                                    value={tokens[idx]}
                                                    onChange={e => {
                                                        const val = e.target.value;
                                                        setTokens(prev => { const n = [...prev]; n[idx] = val; return n; });
                                                    }}
                                                    placeholder={idx === 0 ? "Paste Discord Token 1..." : `Paste Token ${idx + 1} (or leave blank)`}
                                                    className="w-full bg-dark-950 border border-dark-700 rounded-lg px-3 py-2 text-xs font-mono text-gray-200 focus:outline-none focus:border-crimson-500"
                                                />
                                            </div>
                                        ))}
                                    </div>

                                    <div className="flex items-center justify-between pt-2">
                                        <button
                                            type="button"
                                            onClick={handleVerifyTokens}
                                            disabled={isVerifying}
                                            className="px-4 py-2 rounded-xl text-xs font-bold bg-dark-700 hover:bg-dark-600 text-white border border-crimson-700/50 transition-all flex items-center gap-2"
                                        >
                                            {isVerifying ? (
                                                <span>⏳ Connecting to Discord Gateway...</span>
                                            ) : (
                                                <span>🔍 Verify Tokens & Load Servers</span>
                                            )}
                                        </button>

                                        {verifyError && (
                                            <span className="text-xs text-crimson-400 font-medium">⚠️ {verifyError}</span>
                                        )}
                                    </div>

                                    {/* Verified Accounts Cards */}
                                    {verifiedAccounts.length > 0 && (
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3 pt-3">
                                            {verifiedAccounts.map((acc, i) => (
                                                <div key={i} className={`p-3 rounded-xl border flex items-center space-x-3 ${acc.valid ? "bg-dark-800/90 border-emerald-500/40" : "bg-dark-800/90 border-crimson-600/40"}`}>
                                                    {acc.avatar ? (
                                                        <img src={acc.avatar} alt="Avatar" className="w-10 h-10 rounded-full border border-dark-600" />
                                                    ) : (
                                                        <div className="w-10 h-10 rounded-full bg-dark-700 flex items-center justify-center font-bold text-gray-300">
                                                            {i + 1}
                                                        </div>
                                                    )}
                                                    <div className="flex-1 min-w-0">
                                                        <div className="text-xs font-bold text-white truncate">
                                                            {acc.username || `Account ${i + 1}`}
                                                        </div>
                                                        <div className="text-[10px] text-gray-400 truncate">
                                                            {acc.valid ? `✅ Connected (${acc.guilds?.length || 0} servers)` : `❌ ${acc.error}`}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Step 2: Target Guild & Channel */}
                                <div className="glass-panel p-6 rounded-2xl space-y-4">
                                    <div className="flex items-center justify-between">
                                        <h3 className="text-base font-bold text-white flex items-center gap-2">
                                            <span className="w-6 h-6 rounded-lg bg-crimson-600/30 text-crimson-400 flex items-center justify-center text-xs font-mono">2</span>
                                            <span>Target Server (Guild) & Channel(s)</span>
                                        </h3>
                                        <button
                                            type="button"
                                            onClick={() => setManualMode(!manualMode)}
                                            className="text-xs text-crimson-400 hover:text-crimson-300 underline"
                                        >
                                            {manualMode ? "Switch to Dropdown Mode" : "Switch to Manual ID Input"}
                                        </button>
                                    </div>

                                    {!manualMode && verifiedAccounts[0]?.guilds?.length > 0 ? (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-medium text-gray-400 mb-1">Select Server (Guild):</label>
                                                <select
                                                    value={selectedGuild}
                                                    onChange={e => {
                                                        const gId = e.target.value;
                                                        setSelectedGuild(gId);
                                                        const gObj = verifiedAccounts[0]?.guilds?.find(g => g.id === gId);
                                                        if (gObj && gObj.channels.length > 0) {
                                                            setSharedConfig(c => ({
                                                                ...c,
                                                                guildID: gId,
                                                                channelID: [gObj.channels[0].id]
                                                            }));
                                                        }
                                                    }}

                                                            : "bg-dark-800/60 border-dark-700 opacity-60"
                                                    }`}
                                                >
                                                    <span className="text-xs font-bold text-white">{item.label}</span>
                                                    <span className={`w-3.5 h-3.5 rounded-full ${sharedConfig[item.key] ? "bg-crimson-500" : "bg-dark-600"}`}></span>
                                                </div>
                                            ))}
                                        </div>
                                    </motion.div>
                                )}

                                {/* Safety & Anti-Ban Tab */}
                                {activeTab === "safety" && (
                                    <motion.div
                                        key="safety"
                                        initial={{ opacity: 0, y: 15 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        exit={{ opacity: 0, y: -15 }}
                                        className="glass-panel rounded-2xl p-6 space-y-6"
                                    >
                                        <h2 className="text-lg font-bold text-white">🛡️ Anti-Ban & Human Emulation Telemetry</h2>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                            <div className="bg-dark-800/80 p-5 rounded-2xl border border-dark-700">
                                                <div className="text-xs text-gray-400 font-bold uppercase">Human Typing Latency</div>
                                                <div className="text-2xl font-extrabold text-white font-mono mt-2">500 - 1400ms</div>
                                                <p className="text-xs text-emerald-400 mt-1">Dispatches sendTyping() before every message</p>
                                            </div>
                                            <div className="bg-dark-800/80 p-5 rounded-2xl border border-dark-700">
                                                <div className="text-xs text-gray-400 font-bold uppercase">Interval Jitter</div>
                                                <div className="text-2xl font-extrabold text-white font-mono mt-2">± 2500ms</div>
                                                <p className="text-xs text-crimson-400 mt-1">Randomized non-repeating command cooldowns</p>
                                            </div>
                                            <div className="bg-dark-800/80 p-5 rounded-2xl border border-dark-700">
                                                <div className="text-xs text-gray-400 font-bold uppercase">Instant Freeze</div>
                                                <div className="text-2xl font-extrabold text-emerald-400 font-mono mt-2">ACTIVE</div>
                                                <p className="text-xs text-gray-400 mt-1">Immediate thread halt on DM/captcha detection</p>
                                            </div>
                                        </div>
                                    </motion.div>
                                )}
                            </AnimatePresence>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-crimson-900/30 bg-dark-950 py-4 text-center text-xs text-gray-500">
                        Trusted OwO Gen v4 Enterprise Edition • Real-Time Web Controller • 3-Token Multi-Account Engine
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<DashboardApp />);
    </script>
</body>
</html>
